# @package _global_

# This config executes inference with PhonVec (phonological-posteriogram):
# Set data field when calling
# eg. python src/main.py experiment=inference/transcribe_phonvec data=doreco data.dataset_name=voxangeles task_name=inf_voxangeles_phonvec inference.inference_runner.hf_repo=<hf repo id or local path>

defaults:
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: ??? # pass inf_<data>_<model> when calling. This will create output dirs accordingly
tags: ["phonvec","inference"]

seed: 42

train: false
test: false
distributed_predict: True

inference:
  num_workers: 15 # number of parallel workers for distributed inference, set acc to gpu memory
  passthrough_keys: ["target", "split", "utt_id", "metadata_idx", "lang_sym"]
  out_file: ${paths.output_dir}/transcription.json
  # an object (or fn that creates such an object) with __call__ method to transcribe single speech
  inference_runner:
    _target_: src.model.phonvec.builders.build_phonvec_inference
    hf_repo: ??? # HuggingFace repo id or local path
    device: cuda # auto, cpu, cuda
    # Optional vocab constraints forwarded to PhoneModel.recognize:
    # lang: eng
    # phoneme: false
    # dedup: true
